---
Name: furdentity-api
---
App\Api\Support\JwtService:
  # Lifetime of a session token in seconds (30 days) – re-issued with a
  # fresh expiry on every authenticated request (see
  # InternalApiController::init()), so this is really "stay logged in as
  # long as you visit at least once every 30 days", not a hard cutoff.
  session_token_ttl: 2592000
  issuer: 'furdentity'
App\Api\AuthController:
  # How long an emailed login link stays valid, in seconds (15 minutes)
  login_code_ttl: 900
