---
Name: furdentity-routes
After:
  - '#rootroutes'
  - '#coreroutes'
  - '#adminroutes'
---
SilverStripe\Control\Director:
  rules:
    # Public API – later gated by an API key (X-Api-Key header)
    'api/v1/public//$Action/$ID/$OtherID': 'App\Api\PublicApiController'
    # Internal API – feeds the own Vue frontend, JWT bearer auth
    'api/v1/internal//$Action/$ID/$OtherID': 'App\Api\InternalApiController'
    # Auth endpoints for the internal API (login / refresh)
    'api/v1/auth//$Action': 'App\Api\AuthController'
    # Mollie webhook – called directly by Mollie, never carries our auth cookie
    'api/v1/billing/webhook': 'App\Api\MollieWebhookController'
    # Everything else is the Vue 3 SPA shell (overrides the framework default
    # '' => SilverStripe\Control\Controller welcome route)
    '': 'App\Control\FrontendController'
    '$@': 'App\Control\FrontendController'
